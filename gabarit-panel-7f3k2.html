<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GABARIT — Panel</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --ink:#141210; --ink-2:#1c1a16; --brass:#c6a15b; --brass-light:#e6cd94;
    --parchment:#f2ebda; --parchment-dim:#e4dcc7; --line:#43402f; --clay:#b5502f; --ok:#7f9a6b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--ink); color:var(--parchment); font-family:'Inter',sans-serif; line-height:1.5;}
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:600;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  .wrap{max-width:1000px; margin:0 auto; padding:32px 24px 80px;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:34px; border-bottom:1px solid var(--line); padding-bottom:20px;}
  header h1{font-size:24px;}
  .tag{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--brass); letter-spacing:.08em; text-transform:uppercase;}
  .tabs{display:flex; gap:10px; margin-bottom:26px;}
  .tab-btn{
    font-family:'JetBrains Mono',monospace; font-size:12.5px; text-transform:uppercase; letter-spacing:.04em;
    background:transparent; border:1px solid var(--line); color:var(--parchment-dim); padding:10px 18px;
    border-radius:8px; cursor:pointer;
  }
  .tab-btn.active{border-color:var(--brass); color:var(--brass-light); background:var(--ink-2);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .card{background:var(--ink-2); border:1px solid var(--line); border-radius:12px; padding:20px 22px; margin-bottom:14px;}
  .order-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:12px;}
  .order-head b{font-size:16px;}
  .order-head .when{color:var(--parchment-dim); font-size:12px;}
  .badge{font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; padding:4px 10px; border-radius:20px; letter-spacing:.04em;}
  .badge.pending{background:rgba(198,161,91,.18); color:var(--brass-light); border:1px solid var(--brass);}
  .badge.validated{background:rgba(127,154,107,.18); color:var(--ok); border:1px solid var(--ok);}
  .badge.refused{background:rgba(181,80,47,.18); color:var(--clay); border:1px solid var(--clay);}
  .order-items{font-size:13.5px; color:var(--parchment-dim); margin-bottom:12px;}
  .order-items div{padding:4px 0; border-bottom:1px dashed var(--line);}
  .order-foot{display:flex; justify-content:space-between; align-items:center;}
  .total{font-family:'JetBrains Mono',monospace; color:var(--brass-light); font-size:15px;}
  .contact{font-size:13px; color:var(--parchment-dim); margin-bottom:10px;}
  .contact b{color:var(--parchment);}
  button.action{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; text-transform:uppercase;
    background:transparent; border:1px solid var(--brass); color:var(--brass-light);
    padding:8px 14px; border-radius:6px; cursor:pointer;
  }
  button.action:hover{background:var(--brass); color:var(--ink);}
  button.action.danger{border-color:var(--clay); color:var(--clay);}
  button.action.danger:hover{background:var(--clay); color:var(--parchment);}
  .empty{color:var(--parchment-dim); font-size:14px; padding:30px 0; text-align:center;}

  .prod-form{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:26px; background:var(--ink-2); border:1px solid var(--line); border-radius:12px; padding:22px;}
  .prod-form .full{grid-column:1/-1;}
  .prod-form label{display:block; font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--brass); margin-bottom:6px;}
  .prod-form input, .prod-form select{
    width:100%; background:var(--ink); border:1px solid var(--line); color:var(--parchment);
    padding:10px 12px; border-radius:7px; font-family:'Inter',sans-serif; font-size:14px;
  }
  .prod-list .row{display:flex; align-items:center; gap:16px;}
  .swatch{width:44px; height:32px; border-radius:5px; flex-shrink:0; border:1px solid var(--line);}
  .prod-info{flex:1;}
  .prod-info b{display:block; font-size:14.5px;}
  .prod-info span{color:var(--parchment-dim); font-size:12.5px;}

  .art-math{background:repeating-linear-gradient(0deg, rgba(198,161,91,.15) 0 1px, transparent 1px 8px), #100f0c;}
  .art-cosmos{background:radial-gradient(1px 1px at 30% 30%, #fff, transparent), radial-gradient(1px 1px at 70% 60%, #fff, transparent), linear-gradient(160deg,#0c1420,#1a0f16);}
  .art-marble{background:radial-gradient(circle at 30% 20%, rgba(230,205,148,.35), transparent 45%), #0e0c0a;}
  .art-terrazzo{background:radial-gradient(circle at 30% 30%, #b5502f 0 5px, transparent 6px), radial-gradient(circle at 70% 60%, #7f9a6b 0 4px, transparent 5px), #e4dcc7;}
  .art-line{background:var(--parchment);}
  .art-custom{background:repeating-linear-gradient(45deg, rgba(198,161,91,.18) 0 2px, transparent 2px 10px), var(--ink-2);}

  .login-box{max-width:340px; margin:80px auto; text-align:center;}
  .login-box .lock{width:50px; height:50px; border:1.5px solid var(--brass); border-radius:50%; display:grid; place-items:center; margin:0 auto 18px; font-size:20px; color:var(--brass);}
  .login-box .field{text-align:left; margin-bottom:14px;}
  .login-box .field label{display:block; font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--brass); margin-bottom:6px;}
  .login-box input{width:100%; background:var(--ink-2); border:1px solid var(--line); color:var(--parchment); padding:12px 14px; border-radius:8px; font-size:14.5px;}
  .login-box button{width:100%; padding:13px; border-radius:8px; border:none; background:var(--brass); color:var(--ink); font-family:'JetBrains Mono',monospace; font-weight:600; text-transform:uppercase; font-size:13px; cursor:pointer; margin-top:6px;}
  .login-box .err{color:var(--clay); font-size:12.5px; margin-top:10px; min-height:16px;}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="loginScreen" class="login-box">
    <div class="lock">🔒</div>
    <h1 style="margin-bottom:22px;">Panel GABARIT</h1>
    <div class="field"><label>Email</label><input type="text" id="adminUser" placeholder="admin@gabarit.tn"></div>
    <div class="field"><label>Mot de passe</label><input type="password" id="adminPass" placeholder="••••••••"></div>
    <button onclick="tryLogin()">Se connecter</button>
    <div class="err" id="loginErr"></div>
  </div>

  <!-- ADMIN CONTENT -->
  <div id="adminScreen" style="display:none;">
    <header>
      <div>
        <h1>Panel GABARIT</h1>
        <div class="tag">Accès administrateur</div>
      </div>
      <button class="action danger" onclick="logout()">Déconnexion</button>
    </header>

    <div class="tabs">
      <button class="tab-btn active" id="tabOrdersBtn" onclick="switchTab('commandes')">Commandes</button>
      <button class="tab-btn" id="tabProdBtn" onclick="switchTab('produits')">Produits</button>
    </div>

    <!-- COMMANDES -->
    <div class="tab-panel active" id="tab-commandes">
      <div id="ordersList"><p class="empty">Chargement…</p></div>
    </div>

    <!-- PRODUITS -->
    <div class="tab-panel" id="tab-produits">
      <div class="prod-form">
        <div>
          <label>Nom du motif</label>
          <input type="text" id="pName" placeholder="Ex: Formules Dorées">
        </div>
        <div>
          <label>Prix de base (TND)</label>
          <input type="text" id="pBase" placeholder="Ex: 38">
        </div>
        <div class="full">
          <label>Description courte</label>
          <input type="text" id="pTag" placeholder="Ex: Noir & or — équations et constantes">
        </div>
        <div>
          <label>Style visuel</label>
          <select id="pArt">
            <option value="art-math">Formules (noir/or)</option>
            <option value="art-cosmos">Constellation (bleu nuit)</option>
            <option value="art-marble">Marbre doré</option>
            <option value="art-terrazzo">Terrazzo (ivoire)</option>
            <option value="art-line">Ligne minimale</option>
            <option value="art-custom">Design personnalisé client</option>
          </select>
        </div>
        <div class="full">
          <button class="action" onclick="addProduct()">+ Ajouter ce motif</button>
        </div>
      </div>
      <div class="prod-list" id="productsList"><p class="empty">Chargement…</p></div>
    </div>
  </div>
</div>

<script>
  // ---------- Supabase (même projet que le site public) ----------
  const SUPABASE_URL = 'https://vuilafzlfukbskefmvxz.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_z-Ljc8SYBkoJZz5-NOsjbA_VgQuG3aV';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ---------- auth ----------
  async function tryLogin(){
    const email = document.getElementById('adminUser').value.trim();
    const pass = document.getElementById('adminPass').value.trim();
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error){
      document.getElementById('loginErr').textContent = 'Identifiant ou mot de passe incorrect.';
      return;
    }
    showAdmin();
  }

  async function logout(){
    await sb.auth.signOut();
    document.getElementById('adminScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'block';
    document.getElementById('adminUser').value = '';
    document.getElementById('adminPass').value = '';
  }

  function showAdmin(){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminScreen').style.display = 'block';
    loadOrders();
    loadProducts();
  }

  function switchTab(name){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    (name==='commandes' ? document.getElementById('tabOrdersBtn') : document.getElementById('tabProdBtn')).classList.add('active');
    document.getElementById('tab-'+name).classList.add('active');
  }

  // ---------- commandes ----------
  async function loadOrders(){
    const box = document.getElementById('ordersList');
    box.innerHTML = '<p class="empty">Chargement…</p>';
    const { data, error } = await sb.from('orders').select('*').order('created_at', {ascending:false});
    if(error){ box.innerHTML = '<p class="empty">Impossible de charger les commandes.</p>'; console.error(error); return; }
    if(!data.length){ box.innerHTML = '<p class="empty">Aucune commande pour le moment.</p>'; return; }
    const statusLabel = {pending:'En attente', validated:'Validée', refused:'Refusée'};
    box.innerHTML = data.map(o=>{
      const when = o.created_at ? new Date(o.created_at).toLocaleString('fr-FR') : '—';
      const items = (o.items||[]).map(it=>`<div>${it.qty} × ${it.design} — ${it.model} (${it.unit} TND/u)</div>`).join('');
      return `
      <div class="card">
        <div class="order-head">
          <div>
            <b>${o.customer_name}</b>
            <div class="when mono">${when}</div>
          </div>
          <span class="badge ${o.status}">${statusLabel[o.status]}</span>
        </div>
        <div class="contact">
          <b>Tél :</b> ${o.customer_phone} &nbsp;·&nbsp; <b>Adresse :</b> ${o.customer_address}, ${o.customer_city}
        </div>
        <div class="order-items">${items}</div>
        <div class="order-foot">
          <span class="total mono">${o.total} TND</span>
          <div style="display:flex; gap:8px;">
            ${o.status==='pending' ? `
              <button class="action" onclick="setStatus('${o.id}','validated')">Valider</button>
              <button class="action danger" onclick="setStatus('${o.id}','refused')">Refuser</button>` :
              `<button class="action" onclick="sendWhatsapp('${o.id}')">Renvoyer WhatsApp</button>`}
          </div>
        </div>
      </div>`;
    }).join('');
    window._orders = data;
  }

  async function setStatus(id, status){
    const { error } = await sb.from('orders').update({ status }).eq('id', id);
    if(error){ alert("Le statut n'a pas pu être mis à jour."); console.error(error); return; }
    await loadOrders();
    if(status==='validated'){ sendWhatsapp(id); }
  }

  function sendWhatsapp(id){
    const order = (window._orders||[]).find(o=>o.id===id);
    if(!order) return;
    const phone = order.customer_phone.replace(/[^0-9]/g,'');
    const itemsText = order.items.map(it=>`${it.qty}x ${it.design} (${it.model})`).join(', ');
    const msg = `Bonjour ${order.customer_name}, votre commande ${order.id} chez GABARIT est validée ✅%0A${itemsText}%0ATotal : ${order.total} TND%0ALivraison à : ${order.customer_address}, ${order.customer_city}%0AMerci pour votre confiance !`;
    window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
  }

  // ---------- produits ----------
  async function loadProducts(){
    const box = document.getElementById('productsList');
    box.innerHTML = '<p class="empty">Chargement…</p>';
    const { data, error } = await sb.from('articles').select('*').order('created_at', {ascending:true});
    if(error){ box.innerHTML = '<p class="empty">Impossible de charger le catalogue.</p>'; console.error(error); return; }
    if(!data.length){ box.innerHTML = '<p class="empty">Aucun produit. Ajoutez-en un ci-dessus.</p>'; return; }
    box.innerHTML = data.map(p=>`
      <div class="card row">
        <div class="swatch ${p.art}"></div>
        <div class="prod-info">
          <b>${p.name}</b>
          <span>${p.tag} · dès ${p.base} TND</span>
        </div>
        <button class="action danger" onclick="deleteProduct('${p.id}')">Supprimer</button>
      </div>`).join('');
  }

  async function addProduct(){
    const name = document.getElementById('pName').value.trim();
    const tag = document.getElementById('pTag').value.trim();
    const base = parseFloat(document.getElementById('pBase').value);
    const art = document.getElementById('pArt').value;
    if(!name || !tag || isNaN(base)){ alert('Merci de remplir tous les champs.'); return; }
    const { error } = await sb.from('articles').insert({ id:'d'+Date.now(), name, tag, base, art });
    if(error){ alert("Le produit n'a pas pu être ajouté."); console.error(error); return; }
    document.getElementById('pName').value='';
    document.getElementById('pTag').value='';
    document.getElementById('pBase').value='';
    await loadProducts();
  }

  async function deleteProduct(id){
    if(!confirm('Supprimer ce motif du catalogue ?')) return;
    const { error } = await sb.from('articles').delete().eq('id', id);
    if(error){ alert("La suppression n'a pas pu être effectuée."); console.error(error); return; }
    await loadProducts();
  }

  // ---------- au chargement : rester connecté si session valide ----------
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if(session){ showAdmin(); }
  })();
</script>
</body>
</html>
